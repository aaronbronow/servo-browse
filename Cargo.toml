[package]
name = "servo-browse"
version = "0.1.0"
edition = "2021"
description = "Headless agentic browser engine for subshells with Lynx-grade TUI rendering and IAB ad detection"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
textwrap = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
scraper = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli"] }
url = "2.5"
regex = "1.10"
crossbeam-channel = "0.5"
dpi = "0.1"
servo = { version = "0.5.0", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
embedder_traits = { package = "servo-embedder-traits", version = "0.5.0" }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

